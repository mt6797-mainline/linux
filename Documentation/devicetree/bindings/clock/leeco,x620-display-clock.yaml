%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/leeco,x620-display-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LeEco X620 retained MM clock parent

maintainers:
  - dysorder <dysorder@users.noreply.github.com>

description: |
  Temporary bring-up provider for firmware's existing MM source. The driver
  reads CLK_CFG_0 and the selected IMGPLL, UNIVPLL or MAINPLL rate without
  changing muxes or PLLs. Native MT6797 MMSYS gates and MIPI TX control the
  downstream display clocks. This provider replaces the global top clock
  driver during X620 bring-up; the two must not be enabled simultaneously.

properties:
  compatible:
    const: leeco,x620-display-clock
  "#clock-cells":
    const: 0
  mediatek,topckgen:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MT6797 TOPCKGEN syscon.
  mediatek,apmixedsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MT6797 APMIXED syscon.

required:
  - compatible
  - "#clock-cells"
  - mediatek,topckgen
  - mediatek,apmixedsys

additionalProperties: false
