%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/leeco,x620-378c81.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LeEco X620 378C81 command-mode panel

maintainers:
  - dysorder <dysorder@users.noreply.github.com>

description: |
  1080x1920 four-lane DSI panel identified as 378C81 by the stock X620 LK.
  The reset signal is controlled by bit 0 of MMSYS LCM_RST_B at offset 0x150.
  Initial bias-rail and external backlight power configuration is retained
  from firmware. The driver performs panel reset and DSI initialization.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: leeco,x620-378c81
  reg:
    maxItems: 1
  mediatek,mmsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MMSYS syscon controlling the panel reset signal.
  port: true

required:
  - compatible
  - reg
  - mediatek,mmsys
  - port

unevaluatedProperties: false
